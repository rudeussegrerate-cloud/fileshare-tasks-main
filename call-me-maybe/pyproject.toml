[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Function calling with constrained decoding for small LLMs (42 project)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "huggingface-hub>=2.5.0",
    "numpy>=2.2.6",
    "pydantic>=2.14.4",
    "torch>=2.14.1",
    "transformers>=5.20.2",
]

[dependency-groups]
dev = [
    "flake8>=7.0.0",
    "mypy>=1.10.0",
    "pytest>=8.0.0",
]

[tool.uv]
package = false
