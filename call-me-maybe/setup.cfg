[flake8]
max-line-length = 100
extend-exclude = .venv,llm_sdk,tests/.venv

[mypy]
python_version = 3.10
exclude = (?x)(
    ^llm_sdk/
    | ^\.venv/
  )
disallow_untyped_defs = True
check_untyped_defs = True
warn_return_any = True
warn_unused_ignores = True
ignore_missing_imports = True

[mypy-llm_sdk.*]
follow_imports = skip
